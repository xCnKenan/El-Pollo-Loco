<!DOCTYPE html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="img/9_intro_outro_screens/start/startscreen_1.png"
    />

    <script src="js/models/drawableObject.class.js"></script>
    <script src="js/models/movable-object.class.js"></script>
    <script src="js/models/character.class.js"></script>
    <script src="js/models/chicken.class.js"></script>
    <script src="js/models/chicken.small.class.js"></script>
    <script src="js/models/cloud.class.js"></script>
    <script src="js/models/statusbar.class.js"></script>
    <script src="js/models/statusbar-bottle.class.js"></script>
    <script src="js/models/statusbar-coins.class.js"></script>
    <script src="js/models/statusbar-endboss.class.js"></script>
    <script src="js/models/world.class.js"></script>
    <script src="js/models/background-object.class.js"></script>
    <script src="js/models/you_lost.class.js"></script>
    <script src="js/models/you_won.class.js"></script>
    <script src="js/models/keyboard.class.js"></script>
    <script src="js/models/level.class.js"></script>
    <script src="js/models/endboss.class.js"></script>
    <script src="js/models/throwableObject.class.js"></script>
    <script src="js/models/bottleOnGround.class.js"></script>
    <script src="js/models/coins.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
    <script src="js/start/mainScreen.class.js"></script>
    <script src="js/start/buttons.class.js"></script>
    <script src="js/start/backgroundImage.class.js"></script>
    <script src="js/start/startToPlay.js"></script>
  </head>

  <body onload="loadStartScreen()" onclick="closeOverlay()">
    <h1>El Pollo Loco</h1>

    <video
      id="turnYourDevice"
      class="turnYourDevice d-none"
      autoplay
      muted
      loop
    >
      <source src="video/turn-your-device.mp4" type="video/mp4" />
    </video>

    <div id="sectionLegalNotice" class="sectionLegalNotice d-none">
        <div onclick="stopPropagation(event)" id="legalNotice" class="legalNotice">
        
          <div id="closeLegalNotice" class="closeLegalNotice">
        <h2>Impressum</h2>
        <img onclick="toggleOverlay('sectionLegalNotice', event)" class="closeLegalNoticeCross" src="icons/close.png" alt="">
        </div>

        <p class="infoAbout">
          Kenan Cetin<br />
          Iserlohner Stra&szlig;e, 6<br />
          33647 Bielefeld
        </p>

        <h2>Kontakt</h2>
        <p class="infoAbout">
          Telefon: 01712154365<br />
          E-Mail: cn.kenan@icloud.com
        </p>

        <p class="infoAbout">
          Quelle:
          <a href="https://www.e-recht24.de">https://www.e-recht24.de</a>
        </p>
        </div>
    </div>

    <div id="relativeDiv" class="relativeDiv">

      <a onclick="toggleOverlay('sectionLegalNotice', event)" id="allInfoAboutCreatorMobile" class="allInfoAboutCreatorMobile">Impressum</a>

      <div
        id="controllsOverlay"
        class="controllsOverlay d-none"
        onclick="stopPropagation(event)"
      >
        <div class="closeOverlay">
          <h2>Controls</h2>
          <img
            onclick="toggleOverlay('controllsOverlay', event)"
            class="closeIcon"
            src="icons/close.png"
            alt=""
          />
        </div>
        <section class="keyControlls">
          <div class="sectionButtons">
            <img
              class="keybindsButton"
              src="img/keybinds/left-arrow.png"
              alt="left-arrow"
            />
            <span class="infoKeybind">Move Left</span>
          </div>

          <div class="sectionButtons">
            <img
              class="keybindsButton"
              src="img/keybinds/right-arrow.png"
              alt="right-arrow"
            />
            <span class="infoKeybind">Move Right</span>
          </div>

          <div class="sectionButtons">
            <img
              class="keybindsButton"
              src="img/keybinds/space.png"
              alt="space"
            />
            <span class="infoKeybind">Jump</span>
          </div>

          <div class="sectionButtons">
            <img
              class="keybindsButton"
              src="img/keybinds/letter-d.png"
              alt="letter-d"
            />
            <span class="infoKeybind">Throw Bottle</span>
          </div>

          <div class="sectionButtons">
            <img
              class="keybindsButton"
              src="img/keybinds/letter-m.png"
              alt="letter-d"
            />
            <span class="infoKeybind">Game Sound</span>
          </div>
        </section>
      </div>

      <canvas id="canvas" width="720" height="480"></canvas>

      <section id="mobileButtons" class="mobileButtons d-none">
        <div class="movement">
          <img
            id="btn-left"
            class="mobilekeybinds"
            src="img/keybinds/left-arrow.png"
            alt="Left"
          />
          <img
            id="btn-right"
            class="mobilekeybinds"
            src="img/keybinds/right-arrow.png"
            alt="Right"
          />
        </div>
        <div class="action">
          <img
            id="btn-space"
            class="mobilekeybinds"
            src="img/keybinds/space.png"
            alt="Jump / Space"
          />
          <img
            id="btn-d"
            class="mobilekeybinds"
            src="img/keybinds/letter-d.png"
            alt="Throw / D"
          />
        </div>
      </section>

      <div id="buttonsFromStart">
        <button
          id="startButton"
          class="startButton"
          onclick="removeButtons();initLevel1(); init()"
        >
          Start
        </button>
        <button
          id="controllsButton"
          class="startButton"
          onclick="toggleOverlay('controllsOverlay', event)"
        >
          Controls
        </button>
      </div>

      <div id="endScreenButtons">
        <button id="restart" class="startButton d-none" onclick="restartGame()">
          Restart
        </button>
        <button
          id="home"
          class="startButton d-none"
          onclick="loadStartScreen(); backToHomeScreen()"
        >
          Home
        </button>
      </div>

      <div class="settingsSection">
        <img
          onclick="getFullScreen()"
          class="fullscreenMode"
          src="icons/fullscreen.png"
          alt=""
        />

        <img
          onclick="toggleAudio()"
          id="speaker"
          class="speakerSettings"
          src="icons/speaker.png"
          alt=""
        />
        <img
          onclick="toggleAudio()"
          id="no-audio"
          class="speakerSettings"
          src="icons/no-audio.png"
          alt=""
        />
      </div>

      <div class="mobileSettingsSection">
        <img
          onclick="loadStartScreen(); backToHomeScreen()"
          class="backToHome"
          src="icons/home.png"
          alt=""
        />
        <img
          class="mobileAudio"
          onclick="toggleAudio()"
          id="speakerMobile"
          class="speakerSettings"
          src="icons/speaker.png"
          alt=""
        />
        <img
          class="mobileAudio"
          onclick="toggleAudio()"
          id="no-audioMobile"
          class="speakerSettings"
          src="icons/no-audio.png"
          alt=""
        />
      </div>
    </div>

    <a onclick="toggleOverlay('sectionLegalNotice', event)" id="allInfoAboutCreator" class="allInfoAboutCreator">Impressum</a>
  </body>
</html>
